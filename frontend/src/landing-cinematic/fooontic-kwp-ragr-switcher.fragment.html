<div class="switcher" role="radiogroup" aria-label="Navigation rapide">
  <span class="switcher__legend">Navigation</span>

  <!-- Accueil -->
  <label class="switcher__option" title="Accueil">
    <input class="switcher__input" type="radio" name="landing-liquid-switcher" value="home" c-option="1" checked/>
    <svg class="switcher__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="var(--c)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5Z"/>
      <path d="M9 21V12h6v9"/>
    </svg>
  </label>

  <!-- Télécharger l'app commerçant -->
  <label class="switcher__option switcher__option--download" title="Télécharger l'app commerçant" aria-label="Télécharger l'app commerçant">
    <input class="switcher__input" type="radio" name="landing-liquid-switcher" value="download" c-option="2"/>
    <svg class="switcher__icon switcher__icon--download" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="11" fill="#0a0d0f"/>
      <path d="M12 16.5V8.25" stroke="#fff" stroke-width="2.85" stroke-linecap="round"/>
      <path d="M8.25 12.75 12 16.5l3.75-3.75" stroke="#fff" stroke-width="2.85" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
  </label>

  <!-- WhatsApp -->
  <label class="switcher__option switcher__option--whatsapp" title="WhatsApp" aria-label="Contacter Myfidpass sur WhatsApp">
    <input class="switcher__input" type="radio" name="landing-liquid-switcher" value="whatsapp" c-option="3"/>
    <svg class="switcher__icon switcher__icon--whatsapp" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="var(--c)" aria-hidden="true">

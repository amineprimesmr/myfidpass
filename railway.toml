# Railway — déploiement du backend (API Fidpass) — bump 2026-03-22b (PATCH settings tampons)
# Dans le dashboard Railway : Root Directory = . (racine du repo)

[build]
builder = "nixpacks"
# PEP 668 : le Python Nix refuse `pip install --user` → venv à la racine du repo (hors `backend/`), puis pip dans ce venv.
buildCommand = "cd backend && npm install && python3 -m venv ../rembg-venv && ../rembg-venv/bin/pip install --upgrade pip && ../rembg-venv/bin/pip install \"rembg[cli]\""

[deploy]
startCommand = "cd backend && node src/index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

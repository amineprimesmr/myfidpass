# Railway — déploiement du backend (API Fidpass) — bump 2026-03-22b (PATCH settings tampons)
# Dans le dashboard Railway : Root Directory = . (racine du repo)

[build]
builder = "nixpacks"
buildCommand = "cd backend && npm install && command -v python3.11 && curl -fsSL https://bootstrap.pypa.io/get-pip.py | python3.11 - --user && python3.11 -m pip install --user \"rembg[cli]\""

[deploy]
startCommand = "cd backend && node src/index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

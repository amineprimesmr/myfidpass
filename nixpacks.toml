# Railway / Nixpacks — fidpass-api (backend dans ./backend)
# Node 22 LTS : évite les surprises si la plateforme bascule sur Node 24 (better-sqlite3 / moteur).
[variables]
NIXPACKS_NODE_VERSION = "22"

# Outils nécessaires pour compiler better-sqlite3 (node-gyp) sur Railway
# python311 : rembg exige Python ≥ 3.11 ; le `python3` Nix seul n’embarque pas `pip` → bootstrap via get-pip (railway.toml).
# curl : téléchargement get-pip.py au build.
# "..." = garder les paquets par défaut (Node.js) et ajouter les suivants
[phases.setup]
nixPkgs = ["...", "python3", "python311", "curl", "gcc", "gnumake"]
